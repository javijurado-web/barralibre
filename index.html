<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barra Libre">
<title>Barra Libre · Fase I</title>

<!-- ===== Tipografías: Barlow Condensed (atlética, dorsales) + Inter (cuerpo) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DISEÑO: "hierro al rojo" — fondo carbón, acento ámbar (acero
   caliente bajo carga). Un único acento; todo lo demás, sobrio.
   ============================================================ */
:root{
  --bg:#14161a; --surface:#1c2026; --surface-2:#242a32; --line:#2f3742;
  --text:#e8eaed; --muted:#9aa3ad; --faint:#5b6571;
  --accent:#ff6b1a; --accent-deep:#c2410c; --ok:#3fae6a;
  --warm:#ffb37a;
  --radius:14px;
  --p25:#d12c2c; --p20:#2f6fd0; --p15:#e0b020; --p10:#3aa657;
  --p5:#c8ccd2; --p2:#3a4250; --p1:#8a93a0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.01em}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* ---- Cabecera ---- */
header{
  position:sticky;top:0;z-index:20;background:rgba(20,22,26,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:'Barlow Condensed';font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand b span{color:var(--accent)}
.bar-icon{width:34px;height:8px;border-radius:3px;background:linear-gradient(90deg,var(--p20),var(--accent));position:relative;flex:none}
.bar-icon::before,.bar-icon::after{content:"";position:absolute;top:-4px;width:5px;height:16px;border-radius:2px;background:var(--text)}
.bar-icon::before{left:5px}.bar-icon::after{right:5px}
.session-pill{font-family:'Barlow Condensed';font-weight:700;font-size:13px;text-transform:uppercase;
  background:var(--surface-2);border:1px solid var(--line);padding:5px 11px;border-radius:999px;color:var(--warm);white-space:nowrap}

main{max-width:560px;margin:0 auto;padding:16px 14px 96px}

/* ---- Navegación inferior ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(20,22,26,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:11px;font-weight:600;padding:4px 0}
nav button .ic{font-size:19px;line-height:1}
nav button.active{color:var(--accent)}

/* ---- Tarjetas ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;cursor:pointer}
.card-head .left{display:flex;align-items:center;gap:11px;min-width:0}
.ex-name{font-family:'Barlow Condensed';font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.ex-scheme{font-size:12px;color:var(--muted);font-weight:600}
.chev{color:var(--faint);transition:transform .18s;font-size:13px}
.card.open .chev{transform:rotate(90deg)}
.card-body{display:none;border-top:1px solid var(--line);padding:6px 15px 14px}
.card.open .card-body{display:block}
.done-tag{font-size:11px;font-weight:700;color:var(--ok);font-family:'Barlow Condensed';text-transform:uppercase}
.fail-tag{font-size:11px;font-weight:700;color:#e0594e;font-family:'Barlow Condensed';text-transform:uppercase}
/* Resultado conseguido / fallo */
.outcome{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 2px;flex-wrap:wrap}
.out-q{font-size:13px;color:var(--muted);font-weight:600}
.out-btns{display:flex;gap:8px}
.out-btn{font-family:'Barlow Condensed';font-weight:700;font-size:14px;padding:8px 14px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.out-btn.ok.sel{background:var(--ok);border-color:var(--ok);color:#0c140f}
.out-btn.no.sel{background:#e0594e;border-color:#e0594e;color:#1a0a08}
.fail-detail{margin-top:8px;padding:10px;background:rgba(224,89,78,.08);border:1px solid rgba(224,89,78,.3);border-radius:10px}
.fail-detail label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.mid-tag{font-size:11px;font-weight:700;color:#e0b020;font-family:'Barlow Condensed';text-transform:uppercase}
/* Resultado de 3 estados */
.outcome3-wrap{margin:12px 0 2px}
.out-q{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:8px}
.outcome3{display:flex;gap:7px}
.o3{flex:1;font-family:'Barlow Condensed';font-weight:700;font-size:14px;padding:11px 6px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);cursor:pointer;text-align:center}
.o3.ok.sel{background:var(--ok);border-color:var(--ok);color:#0c140f}
.o3.mid.sel{background:#e0b020;border-color:#e0b020;color:#1a1405}
.o3.no.sel{background:#e0594e;border-color:#e0594e;color:#1a0a08}
.o3-next{margin-top:9px;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 11px}
.o3-next b{color:var(--warm)}
.o3-note{margin-top:8px}
.o3-note textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:15px;font-family:inherit}
.stall-note{background:rgba(224,89,78,.1);border:1px solid rgba(224,89,78,.35);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--warm);margin:8px 0}
.stall-note b{color:#e0594e}

/* ---- Series ---- */
.set-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--surface-2)}
.set-row:last-child{border-bottom:none}
.set-meta{flex:none;width:84px}
.set-meta .lbl{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase}
.set-meta .reps{font-family:'Barlow Condensed';font-weight:600;font-size:15px;color:var(--muted)}
.set-w{flex:1;display:flex;align-items:baseline;gap:5px}
.set-w .kg{font-family:'Barlow Condensed';font-weight:800;font-size:30px;line-height:1}
.set-w .u{font-size:12px;color:var(--faint);font-weight:600}
.set-w.workset .kg{color:var(--warm)}
.tick{flex:none;width:42px;height:42px;border-radius:11px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:transparent;background:var(--surface-2);transition:.12s}
.tick.on{background:var(--ok);border-color:var(--ok);color:#0c140f}
.tick:active{transform:scale(.92)}

/* ---- Barra con discos (firma visual) ---- */
.barbell{display:flex;align-items:center;justify-content:center;gap:1px;height:38px;margin:2px 0 4px}
.barbell .sleeve{height:6px;width:26px;background:var(--faint);border-radius:2px}
.plate{border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed';font-weight:700;font-size:10px;color:#0c0f13;min-width:11px}
.plate.t{color:#fff}
.platecalc-note{font-size:11px;color:var(--faint);text-align:center;margin-top:-2px}

/* ---- Botones ---- */
.btn{display:block;width:100%;text-align:center;font-family:'Barlow Condensed';font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;font-size:17px;padding:15px;border-radius:12px;background:var(--accent);color:#160a02}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.deep{background:var(--accent-deep);color:#fff}
.btn-row{display:flex;gap:10px;margin:14px 0}
.btn-row .btn{margin:0}

/* ---- Inputs ---- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
input[type=number],input[type=text],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:12px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline-num{width:70px!important;padding:8px!important;text-align:center}

/* ---- Varios ---- */
.eyebrow{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-size:13px;margin:2px 0 10px}
.h-big{font-family:'Barlow Condensed';font-weight:800;font-size:30px;text-transform:uppercase;line-height:1.05;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.help{font-size:13px;color:var(--muted);background:var(--surface-2);border-left:3px solid var(--accent);
  border-radius:8px;padding:11px 13px;margin-top:8px}
.help b{color:var(--text)}
.help .pageref{display:inline-block;margin-top:6px;color:var(--warm);font-weight:600;font-size:12px}
.acc-input{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0}
.acc-input span{font-size:13px;color:var(--muted)}
.progress-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.progress-pick button{font-family:'Barlow Condensed';font-weight:700;font-size:13px;padding:7px 11px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.progress-pick button.sel{background:var(--accent);color:#160a02;border-color:var(--accent)}
.spark{width:100%;height:120px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair}
.chart-tip{position:absolute;top:6px;transform:translateX(-50%);background:#0e1013;border:1px solid var(--line);color:var(--text);
  font-size:12px;padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.chart-tip b{color:var(--warm)}
.chart-ctrls{display:flex;gap:6px;justify-content:center;margin-top:8px}
.cbtn{width:42px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--text);
  font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:active{background:var(--surface-2)}
.bench-key{color:#3fae6a;font-weight:600}
/* Línea "última vez -> hoy" en cada ejercicio */
.prevline{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:11px}
.prevline b{color:var(--text)}
.dlt{font-family:'Barlow Condensed';font-weight:700;margin-left:3px;white-space:nowrap}
.dlt.up{color:var(--ok)} .dlt.dn{color:#e0594e} .dlt.eq{color:#e0b020}
/* Plancha lateral: 4 recuadros (2 por lado) */
.acc-col{display:flex;flex-direction:column}
.acc-cap{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.time4grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.t4cell{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.t4cell input{width:100%}
.stat-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--surface-2);font-size:14px}
.stat-line:last-child{border:none}
.stat-line b{font-family:'Barlow Condensed';font-weight:700;color:var(--warm);font-size:18px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--accent);color:#160a02;
  font-weight:700;font-family:'Barlow Condensed';text-transform:uppercase;padding:11px 20px;border-radius:999px;
  z-index:50;opacity:0;transition:.25s;pointer-events:none;font-size:14px;letter-spacing:.03em}
.toast.show{opacity:1}
.failtoggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.failtoggle input{width:auto}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}
.tiny{font-size:12px;color:var(--faint)}
.center{text-align:center}
/* Modal de confirmación propio (no depende del confirm() nativo) */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,9,11,.7);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:340px;width:100%}
.modal-box p{margin:0 0 18px;font-size:15px;white-space:pre-line;text-align:left}
.modal-box .btn-row{margin:0}
/* Temporizador de descanso flotante */
.rest-pill{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);z-index:40;
  display:none;align-items:center;gap:12px;background:var(--accent);color:#160a02;
  padding:10px 14px 10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);
  font-family:'Barlow Condensed';font-weight:700;opacity:0;transition:.25s}
.rest-pill.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
.rest-pill .rest-lbl{text-transform:uppercase;font-size:13px;letter-spacing:.05em;opacity:.8}
.rest-pill #rest-time{font-size:24px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.rest-pill #rest-skip{background:rgba(0,0,0,.18);color:#160a02;width:28px;height:28px;border-radius:50%;font-size:14px;font-weight:700}
/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.cal-nav{font-size:26px;color:var(--accent);width:42px;height:42px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow div{text-align:center;font-size:11px;color:var(--faint);font-weight:700;padding-bottom:4px;font-family:'Barlow Condensed'}
.cal-cell{aspect-ratio:1;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:42px}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.f{background:rgba(255,107,26,.14);border-color:rgba(255,107,26,.4)}
.cal-cell.h{background:rgba(255,179,122,.12);border-color:rgba(255,179,122,.35)}
.cal-cell.today{outline:2px solid var(--accent);outline-offset:-1px}
.cal-d{font-family:'Barlow Condensed';font-weight:600;font-size:13px;color:var(--muted)}
.cal-lab{font-family:'Barlow Condensed';font-weight:700;font-size:11px;color:var(--warm);line-height:1}
.cal-cell.f .cal-lab{color:var(--accent)}
.cal-chk{position:absolute;top:2px;right:4px;font-size:10px;color:var(--ok)}
.cal-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0}
.cal-legend .lg{width:13px;height:13px;border-radius:4px;display:inline-block}
.cal-legend .lg.f{background:rgba(255,107,26,.45)}
.cal-legend .lg.h{background:rgba(255,179,122,.4)}
.cal-legend .lg.tdy{outline:2px solid var(--accent);outline-offset:-2px;background:transparent}
/* Nav: 6 pestañas */
nav button{font-size:9px}
nav button .ic{font-size:17px}
nav button{padding-left:1px;padding-right:1px}
.arch-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px;cursor:pointer;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.arch-toggle input{width:16px;height:16px;accent-color:var(--accent)}
/* Calentamiento general */
.warmup-card{border-color:rgba(255,107,26,.35)}
.wu-block{margin-bottom:10px}
.wu-t{font-family:'Barlow Condensed';font-weight:700;font-size:14px;text-transform:uppercase;color:var(--warm);display:block;margin-bottom:3px}
.wu-block p{margin:0;font-size:13.5px;color:var(--muted)}
.wu-list{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.wu-list li{margin-bottom:3px}
/* Termómetro de esfuerzo 1-5 */
.rir-wrap{margin:12px 0 2px}
.rir{display:flex;gap:6px;margin-top:8px}
.rir-b{flex:1;font-family:'Barlow Condensed';font-weight:700;font-size:17px;padding:10px 0;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.rir-b.sel{color:#160a02;border-color:transparent}
.rir-b.lvl1.sel{background:#3fae6a}.rir-b.lvl2.sel{background:#8bbf3f}
.rir-b.lvl3.sel{background:#e0b020}.rir-b.lvl4.sel{background:#e08a2e}.rir-b.lvl5.sel{background:#e0594e}
/* ===== Nutrición ===== */
.pyramid{display:flex;flex-direction:column;gap:4px;margin:6px 0 4px}
.pyr-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.pyr-row .lvl{font-family:'Barlow Condensed';font-weight:700;color:var(--accent);font-size:13px;min-width:96px;text-transform:uppercase}
.pyr-row small{color:var(--muted);font-size:12px}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--muted);margin:10px 0}
.note b{color:var(--text)}
.note.warn{border-left-color:#e0594e}
.lead{color:var(--muted);margin-bottom:14px}
.sub2{font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-transform:uppercase;margin:22px 0 8px;color:var(--warm)}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res-block{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
.res-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--surface-2)}
.res-row:last-child{border:none}
.res-row .rn{font-weight:600;font-size:14px}
.res-row .rn small{display:block;color:var(--faint);font-weight:500;font-size:11.5px}
.res-row .kcal{font-family:'Barlow Condensed';font-weight:800;font-size:21px;color:var(--warm)}
.res-row .macros{font-family:'Barlow Condensed';font-weight:600;font-size:13px;color:var(--muted);text-align:right;min-width:118px}
.ntabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px}
.ntabs button{flex:none;font-family:'Barlow Condensed';font-weight:700;font-size:13px;padding:8px 12px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ntabs button.sel{background:var(--accent);border-color:var(--accent);color:#160a02}
.phase{display:none}.phase.show{display:block}
.tag{display:inline-block;font-family:'Barlow Condensed';font-weight:700;font-size:11px;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin:0 5px 5px 0}
.tag.bloc{background:rgba(255,107,26,.16);color:var(--warm);border:1px solid rgba(255,107,26,.4)}
.tag.sup{background:rgba(63,174,106,.14);color:#7fd6a0;border:1px solid rgba(63,174,106,.35)}
.kv{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--surface-2);font-size:14px}
.kv:last-child{border:none}
.kv .k{font-weight:600;min-width:104px;color:var(--warm)}

/* ---------- 3) Motor de cálculo ---------- */
const floorTo=(x,s)=>Math.floor(x/s)*s;
const round=(x)=>Math.round(x); // JS redondea .5 hacia arriba, igual que el Excel

// Conjunto de pesos por lado alcanzables con tus discos (knapsack ilimitado, rejilla 0,25)
let _reachCache=null,_reachKey='';
function reachable(){
  const key=S.cfg.plates.join(',');
  if(_reachKey===key&&_reachCache) return _reachCache;
  const step=0.25, N=Math.round(200/step)+1, r=new Array(N).fill(false); r[0]=true;
  S.cfg.plates.filter(p=>p>0).forEach(p=>{ const pi=Math.round(p/step); if(pi>0) for(let i=pi;i<N;i++) if(r[i-pi]) r[i]=true; });
  _reachCache=r; _reachKey=key; return r;
}
function isLoadable(w){
  const bar=S.cfg.bar; if(w<bar-1e-9) return false;
  const per=(w-bar)/2, idxf=per/0.25, idx=Math.round(idxf);
  if(Math.abs(idxf-idx)>1e-6) return false;      // no cae en la rejilla
  const r=reachable(); return idx>=0&&idx<r.length&&r[idx];
}
// Ajusta cualquier peso al cargable más cercano con tus discos reales.
function nearestLoadable(target){
  const bar=S.cfg.bar; if(target<=bar) return bar;
  for(let d=0; d<=20.0001; d+=0.25){
    if(isLoadable(target-d)) return Math.round((target-d)*100)/100;
    if(isLoadable(target+d)) return Math.round((target+d)*100)/100;
  }
  return Math.round(target*2)/2;
}

function startWork(liftKey){
  const rm=S.cfg.rm[liftKey], d=S.cfg.descarga, m=S.cfg.minInc;
  return round((rm - rm*d)/m)*m;
}
// nº de veces que el ejercicio ha aparecido hasta la sesión s (incluida)
function occurrences(day, s){
  if(day==='AB') return s;
  if(day==='A')  return Math.ceil(s/2);   // aparece en impares 1,3,5...
  if(day==='B')  return Math.floor(s/2);  // aparece en pares 2,4,6...
}
function appearsIn(day,s){ const isA = s%2===1; return day==='AB' || (day==='A'&&isA) || (day==='B'&&!isA); }
// Última sesión registrada (anterior a s) en la que apareció el ejercicio
function prevAppearance(liftKey, s){
  const day=LIFTS[liftKey].day;
  for(let p=s-1;p>=1;p--) if(appearsIn(day,p)&&sessionLogged(p)) return p;
  return null;
}

/* ¿Falló este ejercicio en la sesión s? */
function liftFailed(s, liftKey){ const o=S.logs[s]&&S.logs[s].out&&S.logs[s].out[liftKey]; return !!(o&&o.r==='fallo'); }
/* Incremento ganado en una sesión registrada, según el resultado (regla del libro):
   limpio = incremento completo · forzado = mitad · fallo = 0 (repite peso) */
function incEarned(liftKey, p){
  const L=LIFTS[liftKey];
  const o=S.logs[p]&&S.logs[p].out&&S.logs[p].out[liftKey];
  const r=o?o.r:'limpio';                 // registrada sin marcar = se considera limpio
  if(r==='fallo') return 0;
  if(r==='forzado') return L.inc/2;
  return L.inc;
}
/* Nº de apariciones del ejercicio en [desde, hasta) */
function appearancesBetween(liftKey, desde, hasta){
  const day=LIFTS[liftKey].day; let n=0;
  for(let p=desde;p<hasta;p++) if(appearsIn(day,p)) n++;
  return n;
}
/* Fallos consecutivos más recientes (para detectar estancamiento) */
function consecutiveFails(liftKey){
  const day=LIFTS[liftKey].day, apps=[];
  for(let p=1;p<=TOTAL_SESSIONS;p++) if(appearsIn(day,p)&&sessionLogged(p)) apps.push(p);
  let c=0; for(let i=apps.length-1;i>=0;i--){ if(liftFailed(apps[i],liftKey)) c++; else break; }
  return c;
}

/* PESO DE TRABAJO — parte del peso inicial y SUMA el incremento ganado en cada
   sesión registrada anterior (completo, medio o cero según el resultado).
   Para sesiones futuras se proyecta asumiendo "limpio". */
function workWeight(liftKey, s){
  const L=LIFTS[liftKey];
  if(!appearsIn(L.day, s)) return null;
  const frontier = lastCompletedSession()+1;
  let w=startWork(liftKey);
  const upto = (s<=frontier) ? s : frontier;
  for(let p=1;p<upto;p++) if(appearsIn(L.day,p)&&sessionLogged(p)) w+=incEarned(liftKey,p);
  if(s>frontier) w += appearancesBetween(liftKey, frontier, s)*L.inc; // proyección optimista
  return w;
}

// Rampa de calentamiento según tipo (porcentajes del Excel)
function warmups(W, type){
  const F=(p)=>Math.max(20, floorTo(p*W,5));
  const F0=(p)=>floorTo(p*W,5); // squat no aplica mínimo de 20
  if(type==='squat') return [{r:'2×5',w:20},{r:'1×5',w:F0(.4)},{r:'1×3',w:F0(.6)},{r:'1×2',w:F0(.8)}];
  if(type==='press') return [{r:'2×5',w:20},{r:'1×5',w:F(.5)},{r:'1×3',w:F(.7)},{r:'1×2',w:F(.85)}];
  if(type==='dead')  return [{r:'2×5',w:20},{r:'1×3',w:F(.6)},{r:'1×2',w:F(.85)}];
  return [];
}

// Construye la sesión completa s (lista de ejercicios con sets)
function buildSession(s){
  const isA = s%2===1;
  const day = isA?'A':'B';
  const order = isA ? ['sentadilla','banca','peso_muerto'] : ['sentadilla','militar','clean'];
  const lifts = order.map(k=>{
    const W=nearestLoadable(workWeight(k,s)); const L=LIFTS[k];
    const wu=warmups(W,L.wuType).map(x=>({...x, w:nearestLoadable(x.w), work:false}));
    const work=Array.from({length:L.work.sets},()=>({r:`1×${L.work.reps}`,w:W,work:true}));
    return {key:k, label:L.label, scheme:`${L.work.sets}×${L.work.reps}`, W, sets:[...wu,...work], page:L.page};
  });
  return {s, day, lifts, accessories:ACCESSORIES[day]};
}

/* ---------- 4) Calculadora de discos ---------- */
function plateBreakdown(target){
  const bar=S.cfg.bar;
  if(target<=bar) return [];
  let perSide=(target-bar)/2, out=[];
  for(const p of [...S.cfg.plates].sort((a,b)=>b-a)){
    while(perSide+1e-9>=p){ out.push(p); perSide=Math.round((perSide-p)*100)/100; }
  }
  return out; // discos por lado, de mayor a menor
}
const plateColor=(p)=>({25:'var(--p25)',20:'var(--p20)',15:'var(--p15)',10:'var(--p10)',5:'var(--p5)',2.5:'var(--p2)',1.25:'var(--p1)',1:'var(--p1)'}[p]||'var(--p1)');
function barbellHTML(target){
  const ps=plateBreakdown(target);
  const left=ps.map(p=>{
    const h=22+p*0.9, dark=[25,20,10,2.5].includes(p)?'t':'';
    return `<div class="plate ${dark}" style="height:${h}px;width:${Math.max(11,p*0.5+8)}px;background:${plateColor(p)}">${p}</div>`;
  }).join('');
  const right=ps.slice().reverse().map(p=>{
    const h=22+p*0.9, dark=[25,20,10,2.5].includes(p)?'t':'';
    return `<div class="plate ${dark}" style="height:${h}px;width:${Math.max(11,p*0.5+8)}px;background:${plateColor(p)}">${p}</div>`;
  }).join('');
  const txt = ps.length? `${S.cfg.bar} + ${ps.map(p=>p).join(' + ')} por lado` : `Solo barra (${S.cfg.bar} kg)`;
  return `<div class="barbell">${left}<div class="sleeve"></div><div class="sleeve" style="width:40px"></div><div class="sleeve"></div>${right}</div>
          <div class="platecalc-note">${txt}</div>`;
}

/* ---------- 5) Helpers de log ---------- */
function logFor(s){ if(!S.logs[s]) S.logs[s]={sets:{}, acc:{}, out:{}, notes:{}, date:null}; const l=S.logs[s]; if(!l.out)l.out={}; if(!l.notes)l.notes={};
  if(l.fail){ for(const k in l.fail){ if(!l.out[k]) l.out[k]={r:'fallo', note:l.fail[k]||''}; } delete l.fail; } // migra formato antiguo
  return l; }
function setKey(liftKey,i){ return liftKey+'_'+i; }
function toggleSet(s,liftKey,i){
  const lg=logFor(s); const k=setKey(liftKey,i);
  lg.sets[k]=!lg.sets[k]; if(!lg.date) lg.date=new Date().toISOString().slice(0,10);
  save();
}
function sessionDone(s){
  const ses=buildSession(s), lg=S.logs[s]; if(!lg) return false;
  return ses.lifts.every(L=>L.sets.every((_,i)=>lg.sets[setKey(L.key,i)]));
}
// Última sesión con fecha registrada (0 si ninguna) y recálculo de "hoy".
function lastCompletedSession(){
  const dated=Object.keys(S.logs).map(Number).filter(s=>S.logs[s] && S.logs[s].date);
  return dated.length? Math.max(...dated):0;
}
function recomputeCurrent(){ S.current = Math.min(TOTAL_SESSIONS, lastCompletedSession()+1); }
function sessionLogged(s){ return !!(S.logs[s] && S.logs[s].date); }

/* Próximo entrenamiento pendiente en el microciclo (3 fuerza + 1 HIIT por semana) */
function nextTraining(){
  for(let w=1;w<=WEEKS;w++){
    for(let k=0;k<3;k++){
      const s=(w-1)*3+k+1; if(s>TOTAL_SESSIONS) break;
      if(!sessionLogged(s)) return {type:'fuerza', s, w};
    }
    if(!(S.hiit[w] && S.hiit[w].done)) return {type:'hiit', w};
  }
  return {type:'done'};
}

        <button class="btn ghost" id="prevBtn">‹ Anterior</button>
        <button class="btn" id="doneBtn">Completar sesión ›</button>
      </div>
      <p class="tiny center">El peso de cada sesión ya está calculado. Marca las series que completes.</p>`;
    const cont=document.getElementById('lifts');
    ses.lifts.forEach(L=>cont.appendChild(liftCard(L,lg)));
    const acc=document.getElementById('acc');
    ses.accessories.forEach(a=>acc.appendChild(accCard(a,lg)));
    const wu=document.querySelector('.warmup-card .card-head'); if(wu) wu.onclick=()=>wu.parentElement.classList.toggle('open');
    document.getElementById('prevBtn').onclick=()=>{ if(S.current>1){S.current--;save();renderHoy();} };
    document.getElementById('doneBtn').onclick=()=>{
      const s=S.current, sesNow=buildSession(s), log=logFor(s);
      const afectados=sesNow.lifts.filter(L=>{ const o=log.out[L.key]; return o&&(o.r==='forzado'||o.r==='fallo'); });
      const guardar=()=>{
        const l=logFor(s);
        l.date ||= new Date().toISOString().slice(0,10);
        if(s===1 && !S.cfg.planStart) S.cfg.planStart=l.date; // ancla el calendario
        const wasLast = s>=TOTAL_SESSIONS;
        recomputeCurrent(); save();
        const nt2=nextTraining();
        hoyMode = (nt2.type==='hiit') ? 'hiit' : 'fuerza';   // si toca HIIT, sugiérelo
        renderHoy(); window.scrollTo(0,0);
        toast(wasLast ? '¡Fase I completada! 🎉' : (nt2.type==='hiit'?'Fuerza guardada · ahora toca HIIT':'Sesión guardada'));
      };
      if(afectados.length){
        let msg='Vas a guardar el día con estos resultados:\n\n';
        afectados.forEach(L=>{
          const o=log.out[L.key];
          if(o.r==='fallo') msg+=`• ${L.label} — FALLO: la próxima vez repites ${L.W} kg (no subes)\n`;
          else { const nw=nearestLoadable(L.W+LIFTS[L.key].inc/2); msg+=`• ${L.label} — FORZADO: la próxima vez +${+(nw-L.W).toFixed(2)} kg → ${nw} kg\n`; }
        });
        msg+='\nEsto se aplicará a partir de ahora. ¿Guardar?';
        askConfirm(msg, guardar, 'Guardar');
      } else guardar();
    };
  }
  // selector de día (común a ambos modos)
  document.querySelectorAll('.day-toggle .dt').forEach(b=>b.onclick=()=>{ hoyMode=b.dataset.mode; renderHoy(); window.scrollTo(0,0); });
}

function prevLine(L){
  const ps=prevAppearance(L.key, S.current);
  if(!ps) return `<div class="prevline">Primera vez con este ejercicio · peso de partida <b>${L.W} kg</b></div>`;
  const pw=nearestLoadable(workWeight(L.key,ps));
  const por=(S.logs[ps].out&&S.logs[ps].out[L.key]&&S.logs[ps].out[L.key].r)||'limpio';
  const delta=+(L.W-pw).toFixed(2);
  const chip = delta>0?`<span class="dlt up">▲ +${delta} kg</span>` : (delta<0?`<span class="dlt dn">▼ ${delta} kg</span>`:`<span class="dlt eq">= repites</span>`);
  return `<div class="prevline">Última vez (S${ps}): ${pw} kg · <b>${por}</b> → hoy <b>${L.W} kg</b> ${chip}</div>`;
}

function outcomeBadge(r,allDone){
  if(r==='fallo') return '<span class="fail-tag">❌ Fallo</span>';
  if(r==='forzado') return '<span class="mid-tag">🟡 Forzado</span>';
  if(r==='limpio'||allDone) return '<span class="done-tag">✓ Limpio</span>';
  return '';
}
function nextPreview(lift, r, curW){
  const inc=LIFTS[lift].inc;
  if(r==='fallo') return `Si lo guardas así · próxima vez: <b>mismo peso, ${curW} kg</b> (lo repites)`;
  const delta=(r==='forzado')?inc/2:inc;
  const nextW=nearestLoadable(curW+delta);
  return `Si lo guardas así · próxima vez: <b>+${+(nextW-curW).toFixed(2)} kg → ${nextW} kg</b>${r==='forzado'?' (medio incremento)':''}`;
}
function applyOutcome(div, lk, r, curW){
  const log=logFor(S.current); log.out[lk]={...(log.out[lk]||{}), r}; save();
  div.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('sel', x.dataset.r===r));
  const nx=div.querySelector('[data-next]'); if(nx) nx.innerHTML=nextPreview(lk,r,curW);
  const nw=div.querySelector('[data-notewrap]'); if(nw) nw.classList.toggle('hidden', !(r==='forzado'||r==='fallo'));
  const head=div.querySelector('.card-head > div:last-child');
  const old=head.querySelector('.fail-tag,.done-tag,.mid-tag'); if(old) old.remove();
  const chev=head.querySelector('.chev'); const badge=outcomeBadge(r,false);
  if(badge && chev) chev.insertAdjacentHTML('beforebegin', badge);
}

// Última sesión registrada (antes de beforeS) con datos de este accesorio
function prevAccessory(accId, beforeS){
  for(let p=beforeS-1;p>=1;p--){
    if(sessionLogged(p) && S.logs[p].acc && S.logs[p].acc[accId] && Object.keys(S.logs[p].acc[accId]).some(k=>S.logs[p].acc[accId][k]!==''&&S.logs[p].acc[accId][k]!=null))
      return {s:p, v:S.logs[p].acc[accId]};
  }
  return null;
}
function accPrevLine(a){
  const p=prevAccessory(a.id, S.current); if(!p) return '';
  const v=p.v; let txt='';
  if(a.kind==='amrap'){ const reps=[v.s0,v.s1,v.s2].filter(x=>x!=null&&x!=='').join(' · '); txt=`${reps||'—'} reps · lastre ${v.lastre??0} kg`; }
  else if(a.kind==='time4'){ txt=['t1','t2','t3','t4'].map(k=>v[k]||'—').join(' / '); }
  else if(a.kind==='time'){ txt=`${v.t1||'—'} · ${v.t2||'—'}`; }
  else return '';
  return `<div class="prevline">Última vez (S${p.s}): <b>${txt}</b> · supérate un poquito 💪</div>`;
}

/* ---- HISTORIAL (fuerza + HIIT, con editar y borrar) ---- */
function renderHistorial(){
  const strength=Object.keys(S.logs).map(Number).filter(s=>S.logs[s].date)
      .map(s=>({type:'fuerza', s, date:S.logs[s].date}));
  const hiits=Object.keys(S.hiit).map(Number).filter(w=>S.hiit[w].done||S.hiit[w].date)
      .map(w=>({type:'hiit', w, date:S.hiit[w].date||'', tag:S.hiit[w].tag||('HIIT 0'+hiitOfWeek(w)), res:S.hiit[w].res||''}));
  const all=[...strength,...hiits].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  app.innerHTML=`<p class="eyebrow">Historial</p>
    <h2 class="h-big" style="font-size:24px">${strength.length} fuerza · ${hiits.length} HIIT</h2>
    ${all.length===0?`<p class="sub">Aún no has guardado nada. Marca tus series en <b>Hoy</b>.</p>`:''}
    <div id="hist"></div>`;
  const c=document.getElementById('hist');
  all.forEach(it=>c.appendChild(it.type==='fuerza'?histStrength(it):histHiit(it)));
}

/* ---- PROGRESO ---- */
// Listón de "intermedio" del libro (si no mueves esto, sigues siendo novato):
// múltiplos de tu peso corporal. Clean no lo da el libro: estimación orientativa.
const BENCH={sentadilla:1.5, peso_muerto:1.8, banca:1.0, militar:0.75, clean:0.7};
let progLift='sentadilla';
let chartWin=null, chartEnd=null;        // ventana de zoom (nº de puntos visibles / índice derecho)
function niceMax(v){ const s=v<=60?5:v<=140?10:20; return Math.ceil(v/s)*s; }
function niceMin(v){ const s=v<=60?5:10; return Math.max(0, Math.floor(v/s)*s); }

function progData(){
  const L=LIFTS[progLift];
  const bw=pesoCorporal7d()||0;   // peso unificado (media 7 días de la pestaña Cuerpo)
  const EPLEY5=1+5/30;            // 5RM -> 1RM (Epley); dividimos para pasar el objetivo 1RM a carga de trabajo
  const bench1RM = bw ? +(bw*BENCH[progLift]).toFixed(1) : null;   // objetivo del libro (a 1RM)
  const benchmark = bench1RM ? nearestLoadable(bench1RM/EPLEY5) : null; // equivalente en tu peso de trabajo (5 reps)
  const startW=startWork(progLift);
  const pts=[]; let projCount=0;
  for(let s=1;s<=TOTAL_SESSIONS;s++){
    if(!appearsIn(L.day,s)) continue;
    const done=sessionLogged(s), w=workWeight(progLift,s);
    pts.push({s,w,done});
    if(!done){ projCount++; if(benchmark && w>=benchmark) break; if(!benchmark && projCount>=8) break; }
  }
  return {L,bw,benchmark,bench1RM,startW,pts};
}
function renderProgreso(){

function clampWin(n){ if(chartWin>n)chartWin=n; if(chartEnd==null)chartEnd=n-1; chartEnd=Math.min(n-1,Math.max(chartWin-1,chartEnd)); }
function drawChart(d){
  const {benchmark,bench1RM,startW,pts}=d, n=pts.length;
  if(chartWin===null||chartWin>n){ chartWin=n; chartEnd=n-1; }
  clampWin(n);
  const vis=pts.slice(chartEnd-chartWin+1, chartEnd+1), m=vis.length;
  const vw=vis.map(p=>p.w);
  let yMax=Math.max(...vw, benchmark||0, startW), yMin=Math.min(...vw, startW);
  yMax=niceMax(yMax+ (yMax-yMin<8?4:0)); yMin=niceMin(yMin-1); if(yMax<=yMin) yMax=yMin+10;
  const VBW=344,VBH=236, mL=40,mR=14,mT=14,mB=24;
  const pX0=mL,pX1=VBW-mR,pY0=mT,pY1=VBH-mB,pW=pX1-pX0,pH=pY1-pY0;
  const X=i=>pX0+pW*(m>1?i/(m-1):0.5);
  const Y=w=>pY1-pH*(w-yMin)/((yMax-yMin)||1);
  let grid='';
  for(let g=0;g<=5;g++){ const val=yMin+(yMax-yMin)*g/5, yy=Y(val).toFixed(1);
    grid+=`<line x1="${pX0}" y1="${yy}" x2="${pX1}" y2="${yy}" stroke="var(--line)" stroke-width="0.7"/>`+
          `<text x="${pX0-5}" y="${(+yy+3).toFixed(1)}" fill="var(--faint)" font-size="9" text-anchor="end" font-family="Inter,sans-serif">${Math.round(val)}</text>`; }
  let xl=''; const idxs=[...new Set(m<=1?[0]:[0,Math.floor((m-1)/2),m-1])];
  idxs.forEach(i=>{ xl+=`<text x="${X(i).toFixed(1)}" y="${pY1+15}" fill="var(--faint)" font-size="9" text-anchor="middle" font-family="Inter,sans-serif">S${vis[i].s}</text>`; });
  xl+=`<text x="${pX0-26}" y="${pY0+4}" fill="var(--faint)" font-size="8" font-family="Inter,sans-serif">kg</text>`;
  let bench='';
  if(benchmark && benchmark>=yMin && benchmark<=yMax){
    const by=Y(benchmark), tagW=134, tagX=Math.max(pX0, pX1-tagW);
    bench=`<line x1="${pX0}" y1="${by.toFixed(1)}" x2="${pX1}" y2="${by.toFixed(1)}" stroke="#3fae6a" stroke-width="1.7" stroke-dasharray="5 3"/>`+
      `<rect x="${tagX}" y="${(by-16).toFixed(1)}" width="${tagW}" height="13" rx="3" fill="#3fae6a"/>`+
      `<text x="${tagX+tagW/2}" y="${(by-6).toFixed(1)}" fill="#0c140f" font-size="8.5" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">INTERMEDIO · ${benchmark} kg${bench1RM?` (≈${bench1RM} a 1RM)`:''}</text>`;
  }
  const line=vis.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.w).toFixed(1)}`).join(' ');
  const dots=vis.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${p.done?3.4:2.2}" fill="${p.done?'var(--warm)':'var(--faint)'}"/>`).join('');
  const svg=document.getElementById('chart');
  svg.innerHTML=`${grid}${bench}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>${dots}${xl}
    <line id="cross" x1="0" y1="${pY0}" x2="0" y2="${pY1}" stroke="var(--warm)" stroke-width="1" opacity="0"/>
    <circle id="crossdot" r="4.6" fill="none" stroke="var(--warm)" stroke-width="2" opacity="0"/>`;
  const tip=document.getElementById('chartTip');
  const at=clientX=>{
    const rect=svg.getBoundingClientRect(); const vx=(clientX-rect.left)/rect.width*VBW;
    let best=0,bd=1e9; vis.forEach((p,i)=>{ const dd=Math.abs(X(i)-vx); if(dd<bd){bd=dd;best=i;} });
    const p=vis[best], px=X(best), py=Y(p.w);
    const cr=document.getElementById('cross'), cd=document.getElementById('crossdot');
    cr.setAttribute('x1',px); cr.setAttribute('x2',px); cr.setAttribute('opacity','0.5');
    cd.setAttribute('cx',px); cd.setAttribute('cy',py); cd.setAttribute('opacity','1');
    tip.innerHTML=`Sesión ${p.s} · <b>${p.w} kg</b>${p.done?' ✓':' <span style="opacity:.6">(previsto)</span>'}`;
    tip.style.opacity='1'; tip.style.left=Math.min(78,Math.max(2,(px/VBW)*100))+'%';
  };
  const hide=()=>{ const cr=document.getElementById('cross'),cd=document.getElementById('crossdot'); if(cr)cr.setAttribute('opacity','0'); if(cd)cd.setAttribute('opacity','0'); tip.style.opacity='0'; };
  svg.onpointerdown=e=>{ if(svg.setPointerCapture){try{svg.setPointerCapture(e.pointerId)}catch(_){}} at(e.clientX); };
  svg.onpointermove=e=>{ if(e.buttons||e.pointerType==='touch') at(e.clientX); };
  svg.onpointerup=hide; svg.onpointercancel=hide; svg.onpointerleave=e=>{ if(!e.buttons) hide(); };
}
function renderStats(d){
  const {L,benchmark,bench1RM,startW,pts}=d;
  const frontier=lastCompletedSession()+1;
  let ns=frontier; while(ns<=TOTAL_SESSIONS && !appearsIn(L.day,ns)) ns++;
  const currentW = ns<=TOTAL_SESSIONS ? workWeight(progLift,ns) : pts[pts.length-1].w;
  const doneCount=pts.filter(p=>p.done).length;
  let html;
  if(benchmark){
    const faltan=Math.max(0,+(benchmark-currentW).toFixed(2));
    const sesiones=faltan>0?Math.ceil(faltan/L.inc):0;
    html=`<div class="stat-line"><span class="bench-key">▦ Objetivo intermedio (carga de trabajo)</span><b>${benchmark} kg</b></div>
      <div class="stat-line">Equivale a (${BENCH[progLift]}× tu peso, a 1RM)<b>${bench1RM} kg</b></div>
      <div class="stat-line">Tu peso de trabajo actual<b>${currentW} kg</b></div>
      <div class="stat-line">Te faltan<b>${faltan>0?('+'+faltan+' kg'):'¡conseguido! 💪'}</b></div>
      ${faltan>0?`<div class="stat-line">Sesiones estimadas (subiendo limpio)<b>~${sesiones}</b></div>`:''}
      <div class="stat-line">Peso de partida<b>${startW} kg</b></div>
      <div class="stat-line">Sesiones completadas<b>${doneCount}</b></div>`;
    html+=`<p class="tiny" style="margin-top:8px">El listón del libro es a 1RM. Lo convertimos a tu carga de trabajo de 5 reps (Epley: 1RM ≈ trabajo × 1,167) para comparar en los mismos kilos que pones en la barra.${progLift==='clean'?' El clean no tiene listón oficial: 0,7× es orientativo.':''}</p>`;
  } else {
    html=`<div class="stat-line">Peso de partida<b>${startW} kg</b></div>

  }
  document.getElementById('pstats').innerHTML=html;
}

/* ---- CALENDARIO / PLAN (flexible) ----
   Lo ya hecho tiene fecha real (fija). Lo que queda se proyecta desde HOY
   (o desde la fecha de reanudación que fijes), repartiendo la secuencia
   pendiente sobre el microciclo: entreno-descanso-entreno-descanso-entreno-HIIT-descanso. */
function isoToDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function dateToIso(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function daysBetween(aIso,bIso){ return Math.round((isoToDate(bIso)-isoToDate(aIso))/86400000); }
function formatEs(iso){ return isoToDate(iso).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}); }
function todayIso(){ return new Date().toISOString().slice(0,10); }

const TRAIN_OFFSETS=[0,2,4,5];                 // días de entreno dentro de cada bloque de 7
function offsetOfIndex(i){ return Math.floor(i/4)*7 + TRAIN_OFFSETS[i%4]; }
// Secuencia ordenada de lo que queda por entrenar (fuerza + HIIT, en orden de microciclo)
function remainingSequence(){
  const seq=[];
  for(let w=1;w<=WEEKS;w++){
    for(let k=0;k<3;k++){ const s=(w-1)*3+k+1; if(s>TOTAL_SESSIONS) break; if(!sessionLogged(s)) seq.push({type:'fuerza', s, day:s%2?'A':'B'}); }
    if(!(S.hiit[w] && S.hiit[w].done)) seq.push({type:'hiit', w});
  }
  return seq;
}
// Fecha desde la que se reparte lo pendiente: la que fijes (si es futura) o hoy
function resumeIso(){ const t=todayIso(); return (S.cfg.resumeDate && S.cfg.resumeDate>=t) ? S.cfg.resumeDate : t; }
function projectedMap(){
  const start=resumeIso(), seq=remainingSequence(), map={};
  seq.forEach((t,i)=>{ const dt=isoToDate(start); dt.setDate(dt.getDate()+offsetOfIndex(i)); map[dateToIso(dt)]={...t}; });
  const endIso = seq.length ? (()=>{ const dt=isoToDate(start); dt.setDate(dt.getDate()+offsetOfIndex(seq.length-1)); return dateToIso(dt); })() : null;
  return {map, start, endIso, seq};
}
function completedMap(){
  const map={};
  Object.keys(S.logs).forEach(s=>{ const l=S.logs[s]; if(l && l.date) map[l.date]={type:'fuerza', s:+s, day:(+s)%2?'A':'B'}; });
  Object.keys(S.hiit).forEach(w=>{ const h=S.hiit[w]; if(h && h.date && h.done) map[h.date]={type:'hiit', w:+w}; });
  return map;
}

let calRef=null; // primer día del mes que se está viendo
function renderCalendario(){
  if(!calRef){ const t=new Date(); calRef=new Date(t.getFullYear(),t.getMonth(),1); }
  const y=calRef.getFullYear(), m=calRef.getMonth();
  const monthName=calRef.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const startWd=(new Date(y,m,1).getDay()+6)%7;      // lunes = 0
  const daysInMonth=new Date(y,m+1,0).getDate();
  const tIso=todayIso();
  const done=completedMap(), proj=projectedMap();

  let cells='';
  for(let i=0;i<startWd;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const iso=dateToIso(new Date(y,m,d));
    const real=done[iso], plan=proj.map[iso];
    let label='', cls='', chk='';
    if(real){ chk='<span class="cal-chk">✓</span>';
      if(real.type==='fuerza'){ label=`F·${real.day}`; cls='f done'; } else { label='H'; cls='h done'; } }
    else if(plan){
      if(plan.type==='fuerza'){ label=`F·${plan.day}`; cls='f'; } else { label='H'+hiitOfWeek(plan.w); cls='h'; } }
    cells+=`<div class="cal-cell ${cls} ${iso===tIso?'today':''}">
      <span class="cal-d">${d}</span>${label?`<span class="cal-lab">${label}</span>`:''}${chk}</div>`;
  }
  const finTxt = proj.endIso ? formatEs(proj.endIso) : '¡Fase completada!';
  const proxTxt = proj.seq.length ? formatEs(proj.start) : '—';
  app.innerHTML=`<p class="eyebrow">Plan · Calendario</p>
    <div class="cal-head">
      <button class="cal-nav" id="calprev">‹</button>
      <h2 class="cond" style="font-size:22px;text-transform:capitalize;margin:0">${monthName}</h2>
      <button class="cal-nav" id="calnext">›</button></div>
    <div class="cal-grid cal-dow">${['L','M','X','J','V','S','D'].map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span class="lg f"></span> Fuerza A/B <span class="lg h"></span> HIIT <span class="lg tdy"></span> Hoy · ✓ realizado</div>
    <div class="card"><div class="card-body" style="display:block;border:none">
      <div class="field" style="margin-bottom:6px"><label>Próximo entrenamiento (cámbialo si te vas unos días)</label>
        <input type="date" id="resumeDate" value="${resumeIso()}" min="${tIso}"></div>
      <div class="stat-line">Fin estimado de fase<b>${finTxt}</b></div>
      <div class="stat-line">Te quedan<b>${proj.seq.length} entrenamientos</b></div>
    </div></div>
    <p class="tiny center" style="margin-top:10px">El plan se proyecta desde hoy y se mueve contigo. Si te vas unos días, pon ahí la fecha en la que vuelves a entrenar y todo se recoloca.</p>`;
  document.getElementById('calprev').onclick=()=>{ calRef=new Date(y,m-1,1); renderCalendario(); };
  document.getElementById('calnext').onclick=()=>{ calRef=new Date(y,m+1,1); renderCalendario(); };
  document.getElementById('resumeDate').addEventListener('change',e=>{
    S.cfg.resumeDate = e.target.value || null; save();
    // saltar la vista al mes de la fecha elegida
    if(e.target.value){ const dt=isoToDate(e.target.value); calRef=new Date(dt.getFullYear(),dt.getMonth(),1); }
    renderCalendario(); toast('Calendario recolocado');
  });
}

function nutCalcular(){
  const edad=+document.getElementById('nu_edad').value, alt=+document.getElementById('nu_alt').value,
        peso=+document.getElementById('nu_peso').value, grasa=parseFloat(document.getElementById('nu_grasa').value);
  const out=document.getElementById('nu_out');
  if(!(edad>0&&alt>0&&peso>0)){ out.innerHTML='<p class="tiny">Rellena edad, altura y peso.</p>'; return; }
  S.cfg.nutri={edad,altura:alt,peso,grasa:isNaN(grasa)?'':grasa}; save();
  // Unificación: el peso vive en Cuerpo. Sembramos hoy si aún no hay registro de hoy.
  const hoyIso=new Date().toISOString().slice(0,10);
  B.daily[hoyIso]=B.daily[hoyIso]||{}; B.daily[hoyIso].peso=peso;
  if(grasa>0) B.daily[hoyIso].grasaImp=B.daily[hoyIso].grasaImp??grasa;
  if(alt>0){ B.config.altura_cm=alt; B.config._alturaSet=true; } if(edad>0) B.config.edad=edad;
  saveBody();
  const mifflin=10*peso+6.25*alt-5*edad+5;
  let tmb=mifflin, metodo='Harris-Benedict (Mifflin)';
  if(grasa>0&&grasa<60){ const magra=peso*(1-grasa/100); tmb=(mifflin+370+21.6*magra)/2; metodo='media Mifflin + Katch-McArdle'; }
  const mant=tmb*1.65, volumen=mant*1.125, defin=mant*0.85, defmax=peso*22;
  const rows=[
    {n:'Mantenimiento',s:'lo que gastas al día',cal:mant,m:nutGramos(mant,2,(mant*0.45/4)/peso,peso)},
    {n:'Volumen',s:'+10-15% · ganar músculo',cal:volumen,m:nutGramos(volumen,2,4.5,peso)},
    {n:'Definición',s:'−15% · perder grasa',cal:defin,m:nutGramos(defin,2.35,3,peso)},
    {n:'Definición máxima',s:'peso × 22 · fase dura',cal:defmax,m:nutGramos(defmax,2.5,0.8,peso)},
  ];
  out.innerHTML=`<div class="res-row"><div class="rn">Metabolismo basal<small>${metodo}</small></div><div class="kcal">${Math.round(tmb)}</div></div>`+
    rows.map(r=>`<div class="res-row"><div class="rn">${r.n}<small>${r.s}</small></div>
      <div style="text-align:right"><div class="kcal">${Math.round(r.cal)} kcal</div>
      <div class="macros">P ${r.m.P} · CH ${r.m.CH} · G ${r.m.G} g</div></div></div>`).join('')+
    `<p class="tiny" style="margin-top:10px">±10%. Si no progresas, ajusta ±100-150 kcal y reevalúa en 1-2 semanas.</p>`;
}

/* ===================== VISTA CUERPO ===================== */
// --- helpers de fechas / series ---
function daysDiff(aIso,bIso){ return Math.round((new Date(bIso)-new Date(aIso))/86400000); }
function bodyPeso(dateIso){ const d=B.daily[dateIso]; return d && d.peso!=null ? d.peso : null; }
// Media de 7 días del peso (fuente de verdad para benchmark y Dieta). Sin datos -> null.
function pesoCorporal7d(){
  const ds=Object.keys(B.daily).filter(f=>B.daily[f].peso!=null).sort();
  if(!ds.length) return (S.cfg.nutri&&+S.cfg.nutri.peso)||null;
  const last=ds[ds.length-1];
  const win=ds.filter(f=>daysDiff(f,last)<=6 && daysDiff(f,last)>=0);
  const vals=win.map(f=>B.daily[f].peso);
  return +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
}
// Jackson-Pollock 3 pliegues (hombre) + Siri
function jp3(pecho,abdomen,muslo,edad){
  const s=pecho+abdomen+muslo;
  const D=1.10938 - 0.0008267*s + 0.0000016*s*s - 0.0002574*edad;
  return +((495/D)-450).toFixed(1);
}
// % grasa "oficial" resuelto para una fecha: plicometría más reciente <= fecha; si no, impedancia
function fatOficial(dateIso){
  const cals=Object.keys(B.calipers).filter(f=>f<=dateIso && B.calipers[f].grasaJP3!=null).sort();
  if(cals.length) return {val:B.calipers[cals[cals.length-1]].grasaJP3, src:'plicómetro'};
  const d=B.daily[dateIso]; if(d && d.grasaImp!=null) return {val:d.grasaImp, src:'impedancia'};
  // impedancia más reciente <= fecha
  const imp=Object.keys(B.daily).filter(f=>f<=dateIso && B.daily[f].grasaImp!=null).sort();
  if(imp.length) return {val:B.daily[imp[imp.length-1]].grasaImp, src:'impedancia'};
  return null;
}
// media móvil de 7 días sobre una serie [{x,y}] (x = día ISO)
function movingAvg(pts, win=7){
  return pts.map((p,i)=>{ const from=new Date(p.x); let s=0,n=0;
    for(let j=i;j>=0;j--){ if(daysDiff(pts[j].x,p.x)>win-1) break; s+=pts[j].y; n++; }
    return {x:p.x, y:+(s/n).toFixed(2)}; });
}
// registros del día a día (daily) desde epoch, opcionalmente + archivo
function dailyRange(includeArchive){
  const src={};
  if(includeArchive) Object.assign(src, B.archive.daily);
  Object.assign(src, B.daily);
  const ep=B.config.epoch;
  return Object.keys(src).filter(f=> includeArchive ? true : f>=ep).sort()
    .map(f=>({date:f, ...src[f]}));
}

// Serie según métrica seleccionada
function metricSeries(includeArchive){
  const rows=dailyRange(includeArchive);
  if(bodyMetric==='peso') return {pts:rows.filter(r=>r.peso!=null).map(r=>({x:r.date,y:r.peso})), unit:'kg', ma:true};
  if(bodyMetric==='musculo') return {pts:rows.filter(r=>r.musculoImp!=null).map(r=>({x:r.date,y:r.musculoImp})), unit:'%', ma:true};
  if(bodyMetric==='grasa'){
    const imp=rows.filter(r=>r.grasaImp!=null).map(r=>({x:r.date,y:r.grasaImp}));
    const cal=Object.keys(B.calipers).filter(f=>includeArchive||f>=B.config.epoch).sort().map(f=>({x:f,y:B.calipers[f].grasaJP3}));
    return {pts:imp, unit:'%', ma:true, points2:cal, hline:B.config.tramoObjetivo, hlabel:`Objetivo ${B.config.tramoObjetivo}%`};
  }
  if(bodyMetric==='kgGrasa'){
    const pts=rows.filter(r=>r.peso!=null).map(r=>{ const f=fatOficial(r.date); return f?{x:r.date,y:+(r.peso*f.val/100).toFixed(2)}:null; }).filter(Boolean);
    const env=fatEnvelope(); return {pts, unit:'kg', envMin:env.min, envMax:env.max};
  }
  if(bodyMetric==='kgMusculo') return {pts:rows.filter(r=>r.peso!=null&&r.musculoImp!=null).map(r=>({x:r.date,y:+(r.peso*r.musculoImp/100).toFixed(2)})), unit:'kg', ma:true};
  if(bodyMetric==='cintura'){
    const per=Object.keys(B.perimeters).filter(f=>(includeArchive||f>=B.config.epoch)&&B.perimeters[f].cintura!=null).sort();
    return {pts:per.map(f=>({x:f,y:B.perimeters[f].cintura})), unit:'cm'};
  }
  return {pts:[], unit:''};
}
// Sobre de pérdida sostenible 0.4–0.7 kg grasa/sem desde epoch
function fatEnvelope(){
  const ep=B.config.epoch;
  const first=Object.keys(B.daily).filter(f=>f>=ep && B.daily[f].peso!=null).sort()[0];
  if(!first) return {min:[],max:[]};
  const f=fatOficial(first); if(!f) return {min:[],max:[]};
  const kg0=B.daily[first].peso*f.val/100;
  const lastRow=dailyRange(false).filter(r=>r.peso!=null).slice(-1)[0];
  const endIso=lastRow?lastRow.date:first;
  const days=Math.max(daysDiff(first,endIso), 84); // proyecta al menos 12 semanas
  const min=[],max=[];
  for(let d=0; d<=days; d+=Math.max(1,Math.round(days/40))){
    const dt=new Date(first); dt.setDate(dt.getDate()+d); const iso=dt.toISOString().slice(0,10);
    min.push({x:iso, y:+(kg0 - B.config.ritmoMin*d/7).toFixed(2)});
    max.push({x:iso, y:+Math.max(0,kg0 - B.config.ritmoMax*d/7).toFixed(2)});
  }
  return {min,max};
}

function bodyCompStats(){
  const ep=B.config.epoch;
  const rows=dailyRange(false).filter(r=>r.peso!=null);
  const el=document.getElementById('bstats');
  if(rows.length<1){ el.innerHTML=`<div class="note">Aún no hay registros desde tu punto cero (${formatEs(ep)}). Registra tu primer día en la pestaña <b>Registro</b>; idealmente con una plicometría en <b>Medidas</b>.</div>`; return; }
  const last=rows[rows.length-1], fo=fatOficial(last.date);
  const p7=pesoCorporal7d();
  let html=`<div class="stat-line">Peso (media 7 días)<b>${p7??'—'} kg</b></div>`;
  if(fo){ const kgF=+(last.peso*fo.val/100).toFixed(1);
    html+=`<div class="stat-line">% grasa oficial (${fo.src})<b>${fo.val}%</b></div>
      <div class="stat-line">kg de grasa<b>${kgF} kg</b></div>`;
    // ritmo real desde epoch (regresión simple sobre kg grasa)
    const series=rows.map(r=>{ const f=fatOficial(r.date); return f?{d:daysDiff(ep,r.date), y:r.peso*f.val/100}:null; }).filter(Boolean);
    if(series.length>=2){
      const rate=slope(series)*7; // kg/sem (negativo = perdiendo)
      const perSem=-rate;
      const tramoKg=last.peso*B.config.tramoObjetivo/100;
      html+=`<div class="stat-line">Ritmo real<b>${perSem>0?'−':'+'}${Math.abs(perSem).toFixed(2)} kg grasa/sem</b></div>`;
      // dentro del sobre?
      let veredicto = perSem<B.config.ritmoMin ? '🟡 por debajo del sobre (lento o estancado)'
        : perSem>B.config.ritmoMax ? '🔴 demasiado agresivo (riesgo de músculo)'
        : '🟢 dentro del sobre sano';
      html+=`<div class="stat-line">vs sobre 0,4–0,7<b>${veredicto}</b></div>`;
      // proyección al tramo objetivo
      if(perSem>0.02 && kgF>tramoKg){
        const semanas=(kgF-tramoKg)/perSem;
        const fin=new Date(last.date); fin.setDate(fin.getDate()+Math.round(semanas*7));
        html+=`<div class="stat-line">Llegas a ${B.config.tramoObjetivo}% (est.)<b>${formatEs(fin.toISOString().slice(0,10))}</b></div>`;
      } else if(kgF<=tramoKg){
        html+=`<div class="note" style="margin-top:8px">🎯 Has alcanzado tu tramo de <b>${B.config.tramoObjetivo}%</b>. Toca cambiar de objetivo: subir fuerza a mantenimiento, y luego apuntar a ${B.config.objFinalMin}–${B.config.objFinalMax}%. Cámbialo en <b>Medidas</b>.</div>`;
      }
    }
  } else {
    html+=`<div class="note" style="margin-top:8px">Sin % de grasa aún. Hazte una <b>plicometría</b> (3 pliegues) en <b>Medidas</b> para fijar tu fuente oficial; mientras, la impedancia sirve de relleno.</div>`;
  }
  el.innerHTML=html;
}
// pendiente por mínimos cuadrados sobre [{d,y}]
function slope(s){ const n=s.length; let sx=0,sy=0,sxy=0,sxx=0; s.forEach(p=>{sx+=p.d;sy+=p.y;sxy+=p.d*p.y;sxx+=p.d*p.d;}); const den=n*sxx-sx*sx; return den?(n*sxy-sx*sy)/den:0; }

      ${stat('fcReposo','FC reposo','↓',' lpm')}
      ${stat('fcRecup1','FC recuperación 1 min','↑',' lpm')}
      ${stat('hrv','HRV','↑',' ms')}
      ${stat('fcIntervalo','FC intervalo (HIIT)','',' lpm')}
    </div>
    <div class="note" style="margin-top:10px">Objetivos: FC reposo <b>baja</b>, recuperación al minuto <b>sube</b>, HRV <b>sube</b>. Son señales de mejor forma cardiovascular.</div>`;
  if(!['fcReposo','fcRecup1','hrv','fcIntervalo'].includes(bodyMetric)) bodyMetric='fcReposo';
  document.querySelectorAll('#cpick button').forEach(b=>b.onclick=()=>{ bodyMetric=b.dataset.m; bodyCorazon(c); });
  document.getElementById('archTog2').onchange=e=>{ showArchive=e.target.checked; bodyCorazon(c); };
  drawBodyChart(true);
}

/* ---- MEDIDAS (plicometría + perímetros + objetivo) ---- */
function bodyMedidas(c){
  const calDates=Object.keys(B.calipers).sort(); const lastCal=calDates[calDates.length-1];
  const cal=lastCal?B.calipers[lastCal]:{};
  const perDates=Object.keys(B.perimeters).sort(); const lastPer=perDates[perDates.length-1];
  const per=lastPer?B.perimeters[lastPer]:{};
  const PF=(k,lab)=>`<div class="field"><label>${lab} (cm)</label><input type="number" inputmode="decimal" data-p="${k}" value="${per[k]??''}" placeholder="—"></div>`;
  c.innerHTML=`
    <p class="eyebrow">Plicometría · Jackson-Pollock 3</p>
    <p class="lead" style="font-size:13px">Los 3 pliegues que puedes hacerte solo. Fuente oficial de % grasa (el libro la prefiere a la báscula).</p>
    <div class="field"><label>Fecha</label><input type="date" id="calDate" value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}"></div>
    <div class="calc-grid">
      <div class="field"><label>Pectoral (mm)</label><input type="number" inputmode="decimal" id="cp" value="${cal.pecho??''}" placeholder="—"></div>
      <div class="field"><label>Abdomen (mm)</label><input type="number" inputmode="decimal" id="ca" value="${cal.abdomen??''}" placeholder="—"></div>
      <div class="field"><label>Muslo (mm)</label><input type="number" inputmode="decimal" id="cm" value="${cal.muslo??''}" placeholder="—"></div>
      <div class="field"><label>% grasa (Siri)</label><input type="text" id="cjp" value="${cal.grasaJP3!=null?cal.grasaJP3+'%':''}" disabled placeholder="auto"></div>
    </div>
    <button class="btn" id="saveCal" style="margin-top:10px">Guardar plicometría</button>

    <p class="eyebrow" style="margin-top:22px">Perímetros · proporciones</p>
    <p class="lead" style="font-size:13px">Parciales permitidos (registra solo lo que midas). La <b>cintura</b> es tu termómetro continuo de grasa.</p>
    <div class="field"><label>Fecha</label><input type="date" id="perDate" value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}"></div>
    <div class="calc-grid">
      ${PF('muneca','Muñeca')}${PF('biceps','Bíceps')}${PF('hombros','Hombros')}${PF('pecho','Pecho')}
      ${PF('cintura','Cintura (ombligo)')}${PF('muslo','Muslo')}${PF('rodilla','Rodilla')}${PF('pantorrilla','Pantorrilla')}
    </div>
    <button class="btn" id="savePer" style="margin-top:10px">Guardar perímetros</button>
    <div class="note" style="margin-top:12px">Los ratios áureos (hombros ≈ 1,61× cintura, etc.) se evalúan <b>en seco al final de definición</b>, no en volumen: la grasa infla la cintura y engaña. Usa la cintura para seguimiento; el set completo, para la foto final.</div>

    <p class="eyebrow" style="margin-top:22px">Objetivo actual</p>
    <div class="card"><div class="card-body" style="display:block;border:none">
      <div class="field"><label>Tramo de grasa objetivo (%)</label><input type="number" inputmode="decimal" id="tramo" value="${B.config.tramoObjetivo}"></div>
      <div class="stat-line">Sobre sano de pérdida<b>${B.config.ritmoMin}–${B.config.ritmoMax} kg grasa/sem</b></div>
      <div class="stat-line">Punto cero (epoch)<b>${formatEs(B.config.epoch)}</b></div>
      <button class="btn ghost" id="saveObj" style="margin-top:10px">Guardar objetivo</button>
      <button class="btn ghost" id="resetEpoch" style="margin-top:8px">Reanclar punto cero a hoy</button>
    </div></div>`;
  // plicometría: cálculo en vivo
  const recompCal=()=>{ const p=+document.getElementById('cp').value, a=+document.getElementById('ca').value, m=+document.getElementById('cm').value;
    if(p>0&&a>0&&m>0) document.getElementById('cjp').value=jp3(p,a,m,B.config.edad)+'%'; };
  ['cp','ca','cm'].forEach(id=>document.getElementById(id).addEventListener('input',recompCal));
  document.getElementById('saveCal').onclick=()=>{ const f=document.getElementById('calDate').value;
    const p=+document.getElementById('cp').value,a=+document.getElementById('ca').value,m=+document.getElementById('cm').value;
    if(!(p>0&&a>0&&m>0)) return toast('Rellena los 3 pliegues');
    B.calipers[f]={pecho:p,abdomen:a,muslo:m,grasaJP3:jp3(p,a,m,B.config.edad)}; saveBody(); toast('Plicometría guardada'); };
  document.getElementById('savePer').onclick=()=>{ const f=document.getElementById('perDate').value; const obj={...(B.perimeters[f]||{})};
    c.querySelectorAll('[data-p]').forEach(i=>{ const k=i.dataset.p,v=i.value.trim(); if(v==='') delete obj[k]; else obj[k]=+v; });
    if(Object.keys(obj).length) B.perimeters[f]=obj; else delete B.perimeters[f]; saveBody(); toast('Perímetros guardados'); };
  document.getElementById('saveObj').onclick=()=>{ const t=+document.getElementById('tramo').value; if(t>0){B.config.tramoObjetivo=t; saveBody(); toast('Objetivo actualizado');} };
  document.getElementById('resetEpoch').onclick=()=>{ askConfirm('¿Poner el punto cero en hoy? Las gráficas del día a día arrancarán desde hoy (el histórico sigue accesible con el toggle).', ()=>{ B.config.epoch=new Date().toISOString().slice(0,10); saveBody(); toast('Punto cero reanclado'); renderCuerpo(); }, 'Reanclar'); };
}

/* ---- GRÁFICA de cuerpo (ejes temporales + tooltip + sobre/objetivo) ---- */
function drawBodyChart(cardio){
  const svg=document.getElementById('bchart'); if(!svg) return;
  const ser=metricSeries(showArchive);
  let pts=ser.pts.slice();
  if(cardio){ const rows=dailyRange(showArchive).filter(r=>r[bodyMetric]!=null); pts=rows.map(r=>({x:r.date,y:r[bodyMetric]})); }
  const tip=document.getElementById('bTip');
  if(!pts.length){ svg.innerHTML=`<text x="172" y="118" fill="var(--faint)" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">Sin datos aún</text>`; return; }
  // dominio X temporal (días desde el primer punto mostrado)
  const allX=[...pts.map(p=>p.x)];
  const ma = (ser.ma && pts.length>=3) ? movingAvg(pts) : null;
  const p2 = ser.points2||null;
  const extra=[]; if(ma) extra.push(...ma.map(p=>p.y)); if(p2) extra.push(...p2.map(p=>p.y));
  const envMin=ser.envMin||null, envMax=ser.envMax||null;
  if(envMin) extra.push(...envMin.map(p=>p.y)); if(envMax) extra.push(...envMax.map(p=>p.y));
  if(ser.hline!=null) extra.push(ser.hline);
  const xs = [...pts, ...(p2||[]), ...(envMin||[]), ...(envMax||[])].map(p=>p.x);
  const x0=xs.reduce((a,b)=>a<b?a:b), x1=xs.reduce((a,b)=>a>b?a:b);
  const span=Math.max(1, daysDiff(x0,x1));
  const ys=[...pts.map(p=>p.y), ...extra];
  let yMin=Math.min(...ys), yMax=Math.max(...ys); const pad=(yMax-yMin)*0.08||1; yMin-=pad; yMax+=pad;
  const VBW=344,VBH=236,mL=40,mR=14,mT=14,mB=24, pX0=mL,pX1=VBW-mR,pY0=mT,pY1=VBH-mB,pW=pX1-pX0,pH=pY1-pY0;
  const X=iso=>pX0+pW*daysDiff(x0,iso)/span;
  const Y=v=>pY1-pH*(v-yMin)/((yMax-yMin)||1);
  let grid='';
  for(let g=0;g<=4;g++){ const val=yMin+(yMax-yMin)*g/4, yy=Y(val).toFixed(1);
    grid+=`<line x1="${pX0}" y1="${yy}" x2="${pX1}" y2="${yy}" stroke="var(--line)" stroke-width="0.7"/><text x="${pX0-5}" y="${(+yy+3).toFixed(1)}" fill="var(--faint)" font-size="9" text-anchor="end" font-family="Inter,sans-serif">${(+val.toFixed(val>60?0:1))}</text>`; }
  // etiquetas X (primera y última fecha)
  const fmt=iso=>{ const d=new Date(iso); return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); };
  let xl=`<text x="${pX0}" y="${pY1+15}" fill="var(--faint)" font-size="9" text-anchor="start" font-family="Inter,sans-serif">${fmt(x0)}</text>
          <text x="${pX1}" y="${pY1+15}" fill="var(--faint)" font-size="9" text-anchor="end" font-family="Inter,sans-serif">${fmt(x1)}</text>`;
  const path=arr=>arr.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  let extraSvg='';
  if(envMin&&envMax){ extraSvg+=`<path d="${path(envMax)}" fill="none" stroke="#3fae6a" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
     <path d="${path(envMin)}" fill="none" stroke="#e0b020" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>`; }
  if(ser.hline!=null){ const hy=Y(ser.hline).toFixed(1); extraSvg+=`<line x1="${pX0}" y1="${hy}" x2="${pX1}" y2="${hy}" stroke="#3fae6a" stroke-width="1.5" stroke-dasharray="5 3"/>
     <rect x="${pX1-92}" y="${(+hy-15).toFixed(1)}" width="90" height="13" rx="3" fill="#3fae6a"/><text x="${pX1-47}" y="${(+hy-5).toFixed(1)}" fill="#0c140f" font-size="8.5" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">${ser.hlabel}</text>`; }
  if(ma) extraSvg+=`<path d="${path(ma)}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
  const mainStroke = ma? 'var(--faint)':'var(--accent)', mainW = ma?'1':'2.4';
  const dots = pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${ma?1.6:2.6}" fill="${ma?'var(--faint)':'var(--warm)'}"/>`).join('');
  const dots2 = p2? p2.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.6" fill="#3fae6a" stroke="#0c140f" stroke-width="0.5"><title>plicómetro ${p.y}%</title></circle>`).join('') : '';
  svg.innerHTML=`${grid}${extraSvg}<path d="${path(pts)}" fill="none" stroke="${mainStroke}" stroke-width="${mainW}" stroke-linejoin="round"/>${dots}${dots2}${xl}
    <line id="bcross" x1="0" y1="${pY0}" x2="0" y2="${pY1}" stroke="var(--warm)" stroke-width="1" opacity="0"/>`;
  // tooltip
  const at=clientX=>{ const rect=svg.getBoundingClientRect(); const vx=(clientX-rect.left)/rect.width*VBW;
    let best=pts[0],bd=1e9; pts.forEach(p=>{ const dd=Math.abs(X(p.x)-vx); if(dd<bd){bd=dd;best=p;} });
    const cr=document.getElementById('bcross'); cr.setAttribute('x1',X(best.x)); cr.setAttribute('x2',X(best.x)); cr.setAttribute('opacity','0.5');
    tip.innerHTML=`${fmt(best.x)} · <b>${best.y} ${ser.unit||''}</b>`; tip.style.opacity='1'; tip.style.left=Math.min(80,Math.max(2,(X(best.x)/VBW)*100))+'%'; };
  const hide=()=>{ const cr=document.getElementById('bcross'); if(cr)cr.setAttribute('opacity','0'); tip.style.opacity='0'; };
  svg.onpointerdown=e=>{at(e.clientX);}; svg.onpointermove=e=>{ if(e.buttons||e.pointerType==='touch') at(e.clientX); };
  svg.onpointerup=hide; svg.onpointerleave=e=>{ if(!e.buttons) hide(); };
}

/* ---- AJUSTES ---- */
function renderAjustes(){
  app.innerHTML=`<p class="eyebrow">Ajustes</p>
    <h2 class="h-big" style="font-size:24px">Tus parámetros</h2>
    <div class="card"><div class="card-body" style="display:block;border:none">
      <p class="tiny" style="margin-top:0">5RM de cada movimiento (3RM en clean)</p>
      <div class="grid2">
        ${Object.entries(LIFTS).map(([k,L])=>`<div class="field"><label>${L.label}</label>
          <input type="number" data-cfg="rm.${k}" value="${S.cfg.rm[k]}" inputmode="decimal"></div>`).join('')}
      </div>
      <div class="grid2">
        <div class="field"><label>Incremento base (kg)</label><input type="number" data-cfg="minInc" value="${S.cfg.minInc}" step="0.5"></div>
        <div class="field"><label>Descarga inicial (%)</label><input type="number" data-cfg="descargaPct" value="${Math.round(S.cfg.descarga*100)}"></div>
        <div class="field"><label>Barra (kg)</label><input type="number" data-cfg="bar" value="${S.cfg.bar}" step="0.5"></div>
        <div class="field"><label>Descanso series (seg)</label><input type="number" data-cfg="restSec" value="${S.cfg.restSec}" step="5"></div>
        <div class="field"><label>Ir a sesión</label><input type="number" data-cfg="current" value="${S.current}" min="1" max="${TOTAL_SESSIONS}"></div>
      </div>
      <div class="field"><label>Discos disponibles por lado (kg, separados por coma)</label>
        <input type="text" data-cfg="plates" value="${S.cfg.plates.join(', ')}"></div>
    </div></div>
    <button class="btn" id="saveCfg">Guardar cambios</button>
    <button class="btn ghost" id="restartBtn" style="margin-top:10px">↺ Volver a la Sesión 1 · Día A (mantiene pesos y ajustes)</button>
    <div class="btn-row">
      <button class="btn ghost" id="exportBtn">Exportar datos</button>
      <button class="btn ghost" id="importBtn">Importar (restaurar)</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <div class="btn-row">
      <button class="btn deep" id="resetBtn">Reiniciar todo</button>
    </div>
    <p class="tiny center">Tus datos se guardan solo en este dispositivo (localStorage). Exporta un JSON con TODO (entreno + cuerpo) para hacer copia, pasar a otro móvil o compartirlo para análisis.</p>`;

  document.getElementById('saveCfg').onclick=()=>{
    app.querySelectorAll('[data-cfg]').forEach(inp=>{
      const path=inp.dataset.cfg, val=inp.value;
      if(path.startsWith('rm.')) S.cfg.rm[path.slice(3)]=parseFloat(val)||S.cfg.rm[path.slice(3)];
      else if(path==='descargaPct') S.cfg.descarga=(parseFloat(val)||10)/100;
      else if(path==='plates') S.cfg.plates=val.split(',').map(x=>parseFloat(x.trim())).filter(x=>x>0);
      else if(path==='current') S.current=Math.min(TOTAL_SESSIONS,Math.max(1,parseInt(val)||1));
      else S.cfg[path]=parseFloat(val)||S.cfg[path];
    });
    save(); render(); toast('Cambios guardados');
  };
  document.getElementById('restartBtn').onclick=()=>{ askConfirm('¿Volver a empezar el programa? Se borran las sesiones y los HIIT registrados, pero se mantienen tus pesos y ajustes.', ()=>{ S.logs={}; S.hiit={}; S.current=1; save(); view='hoy'; render(); toast('Empiezas de nuevo · Sesión 1 · Día A'); }, 'Reiniciar'); };
  document.getElementById('resetBtn').onclick=()=>{ askConfirm('¿Borrar todo y empezar de cero? No se puede deshacer.', ()=>{ localStorage.removeItem(KEY); S=load(); if(!S.hiit)S.hiit={}; view='hoy'; render(); }, 'Reiniciar'); };
  document.getElementById('exportBtn').onclick=()=>{
    const data={ _app:'BarraLibre', _version:1, _exported:new Date().toISOString(), training:S, body:B };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`barralibre-datos-${new Date().toISOString().slice(0,10)}.json`; a.click();
    toast('Exportado: entreno + cuerpo');
  };
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const d=JSON.parse(rd.result);
      const t=d.training||d;                       // admite export nuevo o antiguo (solo S)
      if(!t||!t.cfg) throw new Error('formato');
      askConfirm('Vas a REEMPLAZAR todos los datos de este dispositivo por los del archivo. ¿Continuar?', ()=>{
        S=t; localStorage.setItem(KEY, JSON.stringify(S));
        if(d.body && d.body.config){ B=d.body; localStorage.setItem(KEY_BODY, JSON.stringify(B)); }
        if(!S.hiit)S.hiit={}; if(!S.cfg.nutri)S.cfg.nutri={};
        view='hoy'; render(); toast('Datos restaurados');
      }, 'Restaurar');
    }catch(err){ toast('Archivo no válido'); } };
    rd.readAsText(file); e.target.value='';
  };
}

/* ---------- 7) Utilidades de UI ---------- */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// ---- Temporizador de descanso (cuenta desde una marca de tiempo, así no se
//      desajusta aunque el navegador pase a segundo plano) ----
let restEnd=0, restInt=null;
function startRest(sec){
  sec = sec || S.cfg.restSec || 120;
  restEnd=Date.now()+sec*1000;
  document.getElementById('rest').classList.add('show');
  if(restInt) clearInterval(restInt);
  tickRest(); restInt=setInterval(tickRest,250);
}
function tickRest(){
  const pill=document.getElementById('rest'), out=document.getElementById('rest-time');
  const ms=restEnd-Date.now();
  if(ms<=0){ clearInterval(restInt); restInt=null; out.textContent='¡Ya!'; beep();
    if(navigator.vibrate) navigator.vibrate([300,120,300]);
    setTimeout(()=>pill.classList.remove('show'),1400); return; }
  const s=Math.ceil(ms/1000);
  out.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function stopRest(){ if(restInt)clearInterval(restInt); restInt=null; document.getElementById('rest').classList.remove('show'); }
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)();
  const o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(.3,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6); o.start(); o.stop(c.currentTime+.6);
}catch(e){} }

// Confirmación propia (funciona también dentro de marcos aislados)
function askConfirm(msg, onYes, yesLabel='Borrar'){
  const ov=document.getElementById('modal');
  document.getElementById('modal-msg').textContent=msg;
  const yes=document.getElementById('modal-yes'), no=document.getElementById('modal-no');
  yes.textContent=yesLabel;
  ov.classList.add('show');
  const close=()=>{ ov.classList.remove('show'); yes.onclick=null; no.onclick=null; ov.onclick=null; };
  yes.onclick=()=>{ close(); onYes(); };
  no.onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); }; // tocar fuera = cancelar
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ view=b.dataset.view; render(); window.scrollTo(0,0); });
document.getElementById('rest-skip').onclick=stopRest;

render();
</script>
